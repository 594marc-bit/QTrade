<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>QTrade · 实盘模拟</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1419; --panel:#1a2029; --panel2:#222b36; --txt:#e4e7eb;
          --muted:#8a94a3; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
          --blue:#3b82f6; --bd:#2a3441; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px;
           background:var(--panel); border-bottom:1px solid var(--bd); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .light { width:10px; height:10px; border-radius:50%; background:var(--red);
           box-shadow:0 0 6px currentColor; }
  .light.alive { background:var(--green); }
  .muted { color:var(--muted); font-size:12px; }
  .layout { display:grid; grid-template-columns:280px 1fr; gap:16px; padding:16px;
            height:calc(100vh - 53px); }
  .col { background:var(--panel); border:1px solid var(--bd); border-radius:8px;
         overflow:auto; }
  .col-head { padding:10px 14px; border-bottom:1px solid var(--bd);
              display:flex; justify-content:space-between; align-items:center;
              position:sticky; top:0; background:var(--panel); z-index:1; }
  .plan-item { padding:12px 14px; border-bottom:1px solid var(--bd); cursor:pointer; }
  .plan-item:hover { background:var(--panel2); }
  .plan-item.active { background:var(--panel2); border-left:3px solid var(--blue); }
  .plan-name { font-weight:600; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; }
  .b-running { background:#16331f; color:var(--green); }
  .b-paused  { background:#3a2a0a; color:var(--amber); }
  .b-stopped { background:#2a3441; color:var(--muted); }
  button { background:var(--panel2); color:var(--txt); border:1px solid var(--bd);
           border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--blue); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.danger { background:#3a1515; border-color:#5a2020; color:#fca5a5; }
  .detail { padding:16px; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:12px 0; }
  .stat { background:var(--panel2); border:1px solid var(--bd); border-radius:6px;
          padding:10px 12px; }
  .stat .k { color:var(--muted); font-size:11px; }
  .stat .v { font-size:18px; font-weight:600; margin-top:2px; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  #equityChart { width:100%; height:260px; background:var(--panel2);
                 border:1px solid var(--bd); border-radius:6px; margin:10px 0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--bd); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .sect { margin-top:18px; }
  .sect h3 { font-size:13px; color:var(--muted); margin:0 0 6px; font-weight:500; }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
  /* modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
           align-items:center; justify-content:center; z-index:10; }
  .modal.show { display:flex; }
  .modal form { background:var(--panel); border:1px solid var(--bd); border-radius:8px;
                padding:20px; width:420px; display:grid; gap:10px; }
  .modal label { font-size:12px; color:var(--muted); }
  .modal input, .modal select { background:var(--panel2); color:var(--txt);
                                 border:1px solid var(--bd); border-radius:5px;
                                 padding:7px; width:100%; font-size:13px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
</head>
<body>
<header>
  <h1>实盘模拟</h1>
  <span id="workerLight" class="light" title="worker 心跳"></span>
  <span id="workerTxt" class="muted">worker: 未知</span>
  <span style="flex:1"></span>
  <span id="refreshTxt" class="muted"></span>
  <button id="newBtn" class="primary">+ 新建方案</button>
</header>

<div class="layout">
  <!-- 左：方案列表 -->
  <div class="col">
    <div class="col-head"><span>方案列表</span><button id="refreshBtn">刷新</button></div>
    <div id="planList"></div>
  </div>

  <!-- 右：详情 -->
  <div class="col">
    <div id="detail" class="detail">
      <div class="empty">选择左侧方案查看详情，或点右上角"新建方案"</div>
    </div>
  </div>
</div>

<!-- 新建方案弹窗 -->
<div class="modal" id="newModal">
  <form id="newForm">
    <h3 style="margin:0">新建实盘模拟方案</h3>
    <div><label>名称</label><input name="name" required placeholder="动量-10万"></div>
    <div><label>选股方案</label><select name="scheme_name" id="schemeSel" required></select></div>
    <div class="row2">
      <div><label>总金额(元)</label><input name="total_capital" type="number" value="100000" required></div>
      <div><label>Top N</label><input name="top_n" type="number" value="10"></div>
    </div>
    <div><label>开始日期</label><input name="start_date" type="date" required></div>
    <div class="row2">
      <div><label>频率类型</label>
        <select name="freq_type" id="freqType">
          <option value="interval">interval (每N分钟)</option>
          <option value="cron">cron (定时)</option>
        </select>
      </div>
      <div><label id="freqSpecLabel">频率值</label><input name="freq_spec" value="5min" required></div>
    </div>
    <div><label>价格源</label>
      <select name="price_source">
        <option value="auto">auto (腾讯→新浪→东财→akshare)</option>
        <option value="tencent">tencent</option>
        <option value="sina">sina</option>
        <option value="eastmoney">eastmoney</option>
        <option value="akshare">akshare</option>
      </select>
    </div>
    <div style="margin-top:4px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:0">
        <input type="checkbox" name="exclude_etf" value="1" checked style="width:auto;margin:0"> 排除ETF/基金
      </label>
    </div>
    <div style="margin-top:2px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:0">
        <input type="checkbox" name="exclude_star" value="1" checked style="width:auto;margin:0"> 排除科创板（688xxx.SH）
      </label>
    </div>
    <div class="row2" style="grid-template-columns:1fr 1fr">
      <button type="button" onclick="document.getElementById('newModal').classList.remove('show')">取消</button>
      <button type="submit" class="primary">创建</button>
    </div>
    <div class="muted" id="newErr"></div>
  </form>
</div>

<script>
const POLL_MS = 30000;
let selectedPid = null, equityChart = null, pollTimer = null;

// ---- echarts 加载（CDN 优先，失败回退本地 /dashboard/echarts.min.js）----
function loadEcharts(ok){var s=document.createElement('script');
  s.onload=ok;
  s.onerror=function(){var s2=document.createElement('script');s2.src='/dashboard/echarts.min.js';s2.onload=ok;document.head.appendChild(s2);};
  s.src='https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js';
  document.head.appendChild(s);}

// ---- helpers ----
const $ = id => document.getElementById(id);
const fmt = n => (n==null||isNaN(n))?'-':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
const fmt3 = n => (n==null||isNaN(n))?'-':Number(n).toFixed(3);
const pct = n => (n==null||isNaN(n))?'-':(Number(n)*100).toFixed(2)+'%';
const cls = v => v>0?'pos':(v<0?'neg':'');

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ const t = await r.text(); throw new Error(t); }
  return r.json();
}

// ---- plan list ----
async function loadPlans(){
  const data = await api('/api/paper/plans');
  const box = $('planList'); box.innerHTML='';
  if(!data.plans.length){ box.innerHTML='<div class="empty">无方案</div>'; return; }
  for(const p of data.plans){
    const d = document.createElement('div');
    d.className = 'plan-item'+(p.id===selectedPid?' active':'');
    d.onclick = ()=>{ selectedPid=p.id; loadPlans(); loadDetail(); };
    d.innerHTML = `<div class="plan-name">${p.name}
        <span class="badge b-${p.status}">${p.status}</span></div>
        <div class="muted">${p.scheme_name} · ${(p.cash>=0?'':'-')+fmt(Math.abs(p.cash))} 元</div>`;
    box.appendChild(d);
  }
}

// ---- detail ----
async function loadDetail(){
  if(selectedPid==null) return;
  const [d, eq, hol, tx] = await Promise.all([
    api('/api/paper/plans/'+selectedPid),
    api(`/api/paper/plans/${selectedPid}/equity?limit=500`),
    api('/api/paper/plans/'+selectedPid+'/holdings-live'),
    api(`/api/paper/plans/${selectedPid}/transactions?limit=50`),
  ]);
  renderDetail(d, eq, hol, tx);
}

function renderDetail(d, eq, hol, tx){
  const p=d.plan, f=d.fees||{}, eq0=eq.equity||[], hol0=hol.holdings||[], tx0=tx.transactions||[], priceMode=hol.price_mode||"close", pricedAt=hol.priced_at||"";
  const last = d.latest_equity || {};
  // 实时计算总权益（现金 + 持仓市值），而非用可能滞后的快照
  const liveHoldingsValue = (hol.holdings||[]).reduce((s,h)=>s+(h.shares||0)*(h.last_price||0),0);
  const totalEquity = (p.cash||0) + liveHoldingsValue;
  const nav = p.total_capital ? totalEquity / p.total_capital : null;
  const totalRet = (nav!=null && p.total_capital) ? (totalEquity - p.total_capital)/p.total_capital : null;

  const statusBtn = (p.status==='running')
    ? `<button class="danger" onclick="ctrl('pause')">暂停</button><button onclick="ctrl('stop')">停止</button>`
    : `<button class="primary" onclick="ctrl('start')">${p.status==='paused'?'继续':'启动'}</button>
       ${p.status==='paused'?'<button class="danger" onclick="ctrl(\'stop\')">停止</button>':''}`;
  $('detail').innerHTML = `
    <div class="controls">
      <div><div class="muted">${p.name}</div>
        <span class="badge b-${p.status}">${p.status}</span>
        <span class="muted"> · ${p.scheme_name} · ${p.freq_type}/${p.freq_spec} · 起始 ${p.start_date} · ${p.exclude_etf ? '排除ETF' : '含ETF'} · ${p.exclude_star ? '排除科创' : '含科创'}</span></div>
      <span style="flex:1"></span>
      ${statusBtn}
      <button class="danger" onclick="del()">删除</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">总权益</div><div class="v ${cls(totalRet)}">${fmt(totalEquity)}</div></div>
      <div class="stat"><div class="k">净值 / 累计收益</div><div class="v ${cls(totalRet)}">${nav!=null?nav.toFixed(4):'-'} <span class="muted">${pct(totalRet)}</span></div></div>
      <div class="stat"><div class="k">现金</div><div class="v">${fmt(p.cash)}</div></div>
      <div class="stat"><div class="k">累计佣金</div><div class="v">${fmt(f.commission)}</div></div>
      <div class="stat"><div class="k">累计印花税</div><div class="v">${fmt(f.stamp_tax)}</div></div>
    </div>
    <div class="sect"><h3>账户净值曲线</h3><div id="equityChart"></div></div>
    <div class="sect"><h3>持仓 (${hol0.length}) <span title="${pmTitle}">${pmLabel}</span></h3>
      <table><thead><tr><th>代码</th><th>持仓</th><th>均价</th><th>现价</th><th>市值</th><th>盈亏</th></tr></thead>
      <tbody>${holRows(hol0, priceMode, pricedAt)}</tbody></table></div>
    <div class="sect"><h3>最近交易 (${tx0.length})</h3>
      <table><thead><tr><th>时间</th><th>代码</th><th>方向</th><th>数量</th><th>价格</th><th>金额</th><th>佣金</th><th>印花税</th></tr></thead>
      <tbody>${txRows(tx0)}</tbody></table></div>`;
  renderEquity(eq0);
}

function holRows(hol, priceMode, pricedAt){
  if(!hol.length) return '<tr><td colspan="6" class="muted">无持仓</td></tr>';
  const pmLabel = priceMode==='live'?'<span style="color:#22c55e;font-size:11px">● 实时</span>':'<span style="color:#8a94a3;font-size:11px">● 收盘</span>';
  const pmTitle = '价格模式: '+priceMode+' · 刷新于 '+pricedAt;
  return hol.map(h=>{
    const mv = (h.shares||0)*(h.last_price||0);
    const cost = (h.shares||0)*(h.avg_cost||0);
    const pnl = mv-cost; const pnlPct = cost? (pnl/cost):0;
    const src = h.price_source||'';
    return `<tr><td>${h.ts_code} <span class="muted" style="font-size:10px">${src}</span></td><td>${h.shares} <span class="muted">(锁${h.t1_shares})</span></td>
      <td>${fmt3(h.avg_cost)}</td><td>${fmt3(h.last_price)}</td><td>${fmt(mv)}</td>
      <td class="${cls(pnl)}">${fmt(pnl)} (${pct(pnlPct)})</td></tr>`;
  }).join('');
}
function txRows(tx){
  if(!tx.length) return '<tr><td colspan="8" class="muted">无交易</td></tr>';
  return tx.map(t=>`<tr><td class="muted">${(t.executed_at||'').slice(5,19)}</td>
    <td>${t.ts_code}</td><td class="${t.action==='BUY'?'pos':'neg'}">${t.action}</td>
    <td>${t.quantity}</td><td>${fmt(t.fill_price)}</td><td>${fmt(t.gross_amount)}</td>
    <td>${fmt(t.commission)}</td><td>${fmt(t.stamp_tax)}</td></tr>`).join('');
}

function renderEquity(eq){
  if(!window.echarts){ setTimeout(()=>renderEquity(eq),300); return; }
  const el = $('equityChart');
  equityChart = echarts.init(el);
  equityChart.setOption({
    grid:{left:50,right:20,top:20,bottom:30},
    tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:eq.map(e=>(e.snapshot_ts||'').slice(5,16)),
           axisLabel:{color:'#8a94a3'}},
    yAxis:[{type:'value',name:'权益',axisLabel:{color:'#8a94a3'}},
           {type:'value',name:'净值',axisLabel:{color:'#8a94a3'}}],
    series:[
      {name:'总权益',type:'line',smooth:true,symbol:'none',
       data:eq.map(e=>e.total_equity),itemStyle:{color:'#3b82f6'},
       areaStyle:{color:'rgba(59,130,246,.1)'}},
      {name:'净值',type:'line',yAxisIndex:1,smooth:true,symbol:'none',
       data:eq.map(e=>e.nav),itemStyle:{color:'#22c55e'}},
    ]
  });
}

// ---- control ----
async function ctrl(action){
  await api(`/api/paper/plans/${selectedPid}/${action}`,{method:'POST'});
  loadPlans(); loadDetail();
}
async function del(){
  if(!confirm('删除该方案及其全部信号/持仓/流水/净值？')) return;
  await api(`/api/paper/plans/${selectedPid}`,{method:'DELETE'});
  selectedPid=null; $('detail').innerHTML='<div class="empty">已删除</div>'; loadPlans();
}

// ---- worker heartbeat ----
async function loadWorker(){
  try{ const w = await api('/api/paper/worker/status');
    $('workerLight').classList.toggle('alive', w.alive);
    $('workerTxt').textContent = w.alive
      ? `worker: 在线 · ${w.heartbeat&&w.heartbeat.running_plans} 方案运行中`
      : 'worker: 离线（未启 worker 进程）';
  }catch(e){ $('workerTxt').textContent='worker: ?'; }
}

// ---- new plan modal ----
async function openNew(){
  $('newModal').classList.add('show');
  const s = $('schemeSel');
  if(!s.options.length){
    const data = await api('/api/dashboard/schemes');
    data.schemes.forEach(x=>{ const o=document.createElement('option');
      o.value=x.name; o.text=x.name+' — '+(x.description||''); s.add(o); });
  }
  // default start_date = tomorrow
  const t = new Date(Date.now()+86400000).toISOString().slice(0,10);
  $('newForm').start_date.value = t;
}
$('newBtn').onclick = openNew;
$('freqType').onchange = function(){
  $('freqSpecLabel').textContent = this.value==='interval' ? '频率值 (如 5min)' : 'cron 表达式';
  document.querySelector('#newForm [name=freq_spec]').placeholder =
    this.value==='interval' ? '5min / 2hour' : '50 14 * * 1-5';
};
$('newForm').onsubmit = async function(e){
  e.preventDefault();
  $('newErr').textContent='';
  const fd = new FormData(this);
  const body = Object.fromEntries(fd);
  body.total_capital = Number(body.total_capital);
  body.top_n = Number(body.top_n)||10;
  body.exclude_etf = body.exclude_etf === '1' ? 1 : 0;
  body.exclude_star = body.exclude_star === '1' ? 1 : 0;
  body.start_date = (body.start_date||'').replace(/-/g,'');
  try{ const r = await api('/api/paper/plans',{method:'POST',
       headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    $('newModal').classList.remove('show');
    selectedPid = r.plan_id; loadPlans(); loadDetail();
  }catch(err){ $('newErr').textContent = '创建失败: '+err.message; }
};

// ---- poll loop ----
function refreshAll(){
  loadPlans(); loadWorker();
  if(selectedPid!=null) loadDetail();
  $('refreshTxt').textContent = '更新于 '+new Date().toLocaleTimeString('zh-CN');
}
$('refreshBtn').onclick = refreshAll;
loadEcharts(()=>{ window.echarts = window.echarts||echarts; refreshAll(); });
pollTimer = setInterval(refreshAll, POLL_MS);
window.addEventListener('resize',()=>equityChart&&equityChart.resize());
</script>
</body>
</html>
