schemes:
  default:
    description: 默认方案
    factors:
    - intraday_range_10d
    - pb_rank
    - pe_ttm_rank
    - trend_60d
    - volatility_20d
    weights:
      intraday_range_score: -0.15
      pb_rank_score: -0.25
      pe_ttm_rank_score: -0.2
      trend_score: -0.1
      volatility_score: -0.15
  conservative:
    description: 低估值稳健策略
    factors:
    - pb_rank
    - pe_ttm_rank
    - trend_60d
    - volatility_20d
    - turnover_momentum_10d
    weights:
      pb_rank_score: -0.3
      pe_ttm_rank_score: -0.25
      trend_score: -0.15
      volatility_score: -0.15
      turnover_momentum_score: -0.15
  v1_zz1000:
    description: 正式方案v1（中证1000，价值+低波动+ROE改善）
    factors:
    - pe_ttm_rank
    - intraday_range_10d
    - volatility_20d
    - roe_yoy_rank
    weights:
      pe_ttm_rank_score: -0.2
      intraday_range_score: -0.15
      volatility_score: -0.15
      roe_yoy_rank_score: 0.3
  momentum:
    description: 动量反转策略
    factors:
    - momentum_20d
    - vol_ratio
    - rsi_14d
    - volatility_20d
    - return_20d
    weights:
      momentum_score: 0.3
      vol_ratio_score: 0.2
      rsi_score: -0.25
      volatility_score: -0.15
      return_20d_score: 0.1
  动量增强版0610:
    description: 动量增强版（6因子，业绩+动量+估值+低波，宽持仓不设硬止损）
    factors:
    - roe_yoy_rank
    - momentum_20d
    - trend_60d
    - pe_ttm_rank
    - intraday_range_10d
    - volatility_20d
    weights:
      roe_yoy_rank_score: 0.25
      momentum_score: 0.2
      trend_score: 0.1
      pe_ttm_rank_score: -0.15
      intraday_range_score: -0.1
      volatility_score: -0.1
  多因子精选版0623:
    description: 多因子精选版（6因子，基本面锚+动量反转+估值双验+资金异动，行业中性）
    factors:
    - momentum_20d
    - pb_rank
    - pe_ttm_rank
    - roe_yoy_rank
    - trend_60d
    - turnover_momentum_10d
    weights:
      roe_yoy_rank_score: 0.25
      momentum_score: -0.15
      trend_score: -0.1
      pe_ttm_rank_score: -0.15
      pb_rank_score: -0.1
      turnover_momentum_score: 0.1
  精简反转版0708:
    description: 精简反转版（权重优化：ROE:Return:RSI = 1:2:1，全周期最优）
    factors:
    - roe_yoy_rank
    - rsi_14d
    - return_20d
    weights:
      roe_yoy_rank_score: 0.25
      rsi_score: -0.25
      return_score: -0.50
  精简自适应版0708:
    description: 精简自适应版（3因子+滚动IC自适应权重，中证1000）
    factors:
    - roe_yoy_rank
    - rsi_14d
    - return_20d
    weights:
      roe_yoy_rank_score: 0.50
      rsi_score: -0.25
      return_score: -0.25
